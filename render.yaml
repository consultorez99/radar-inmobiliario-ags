# OJO: este archivo solo aplica si el servicio está gestionado por Blueprint
# (New + → Blueprint sobre el repo; adopta el servicio existente por `name`).
# Un Static Site creado a mano en el dashboard lo ignora — autodeploya desde
# GitHub pero NO aplica `headers` ni `routes`. Ver "Despliegue" en README.md.
services:
  - type: web
    name: radar-inmobiliario-ags
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      # Redirect (no rewrite) para que la URL quede en /web/ y así los assets
      # relativos (styles.css, main.js, fetch("../data/...")) resuelvan bien.
      - type: redirect
        source: /
        destination: /web/
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600

  # Proxy de OpenRouteService para el modo "A pie" de las isócronas (proxy/).
  # Existe porque la clave de ORS no se puede restringir por dominio y por lo
  # tanto no puede vivir en web/config.js, que es público. Ver README.
  - type: web
    name: radar-inmobiliario-ags-proxy
    runtime: node
    plan: free
    rootDir: proxy
    buildCommand: npm install
    startCommand: npm start
    # Render reinicia el servicio si /salud deja de responder. La app también
    # pega aquí para despertarlo (el plan free duerme tras ~15 min sin uso).
    healthCheckPath: /salud
    envVars:
      # sync: false = Render la pide en el dashboard y NO se guarda en el repo.
      # Es todo el punto de este servicio: la clave nunca se versiona.
      - key: ORS_API_KEY
        sync: false
      - key: ORIGENES_PERMITIDOS
        value: https://radar-inmobiliario-ags.onrender.com
